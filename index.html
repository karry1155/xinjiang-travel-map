<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>新疆 8 日路线地图</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --ink: #17212b;
      --muted: #667483;
      --panel: rgba(255, 255, 255, 0.94);
      --line: rgba(27, 42, 55, 0.14);
      --teal: #0f766e;
      --road: #c05a22;
      --flight: #2563eb;
      --return: #6d35c6;
      --gold: #a45a13;
      --shadow: 0 18px 46px rgba(17, 30, 42, 0.18);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      background: #edf3f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button { font: inherit; }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #dce8ee;
    }

    .shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(237, 243, 246, 0.94),
        rgba(237, 243, 246, 0.18) 150px,
        rgba(237, 243, 246, 0) calc(100% - 170px),
        rgba(237, 243, 246, 0.95)
      );
    }

    .top-card {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      left: 12px;
      z-index: 5;
      padding: 14px;
      border: 1px solid rgba(27, 42, 55, 0.12);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .top-card.expanded {
      max-height: calc(100vh - 112px);
      overflow-y: auto;
    }

    .day-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .day-chip {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: #e7f6f3;
      color: var(--teal);
      font-size: 13px;
      font-weight: 820;
      white-space: nowrap;
    }

    .mode-pill {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }

    .top-card h1 {
      margin: 9px 0 6px;
      font-size: 22px;
      line-height: 1.18;
      font-weight: 840;
    }

    .route-line {
      display: none;
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
      font-weight: 760;
    }

    .stay-line {
      display: none;
      margin: 8px 0 0;
      color: #95530f;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 780;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .control-button {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(27, 42, 55, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 780;
    }

    .control-button.primary {
      border-color: rgba(15, 118, 110, 0.5);
      background: var(--teal);
      color: #fff;
    }

    .control-button:hover,
    .control-button:focus-visible {
      border-color: var(--teal);
      outline: none;
    }

    .detail-sheet {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .detail-sheet.open { display: block; }

    .sheet-head {
      display: none;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .sheet-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .detail-route {
      margin: 0;
      font-size: 15px;
      line-height: 1.55;
      font-weight: 760;
    }

    .detail-desc {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .night-box {
      margin-top: 14px;
      padding: 12px 13px;
      border: 1px solid rgba(164, 90, 19, 0.22);
      border-radius: 8px;
      background: #fff8ed;
    }

    .night-box span {
      display: block;
      color: #934f0f;
      font-size: 12px;
      font-weight: 820;
    }

    .night-box b {
      display: block;
      margin-top: 4px;
      font-size: 16px;
      line-height: 1.35;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .chip {
      padding: 6px 9px;
      border-radius: 7px;
      background: #edf6f4;
      color: #155e57;
      font-size: 12px;
      font-weight: 740;
    }

    .day-rail {
      position: absolute;
      right: 0;
      bottom: env(safe-area-inset-bottom);
      left: 0;
      z-index: 5;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 74px;
      gap: 8px;
      padding: 10px 12px 12px;
      border-top: 1px solid rgba(27, 42, 55, 0.12);
      background: rgba(255, 255, 255, 0.93);
      box-shadow: 0 -12px 34px rgba(17, 30, 42, 0.12);
      backdrop-filter: blur(16px);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
    }

    .route-caption {
      position: absolute;
      right: 12px;
      bottom: calc(86px + env(safe-area-inset-bottom));
      left: 12px;
      z-index: 5;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0;
      scrollbar-width: none;
    }

    .route-caption::-webkit-scrollbar { display: none; }

    .overview-list {
      position: absolute;
      right: 12px;
      bottom: calc(154px + env(safe-area-inset-bottom));
      left: 12px;
      z-index: 6;
      display: none;
      max-height: min(42vh, 360px);
      overflow-y: auto;
      padding: 8px;
      border: 1px solid rgba(27, 42, 55, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 14px 34px rgba(17, 30, 42, 0.16);
      backdrop-filter: blur(16px);
    }

    .overview-list.open { display: grid; gap: 7px; }

    .overview-list-item {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 8px;
      border: 1px solid rgba(27, 42, 55, 0.1);
      border-radius: 8px;
      background: rgba(248, 251, 252, 0.88);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .overview-list-item:focus-visible {
      border-color: var(--teal);
      outline: none;
    }

    .overview-list-item .days {
      display: inline-grid;
      place-items: center;
      min-height: 26px;
      border-radius: 999px;
      background: var(--teal);
      color: #fff;
      font-size: 11px;
      font-weight: 860;
    }

    .overview-list-item.overnight .days { background: var(--gold); }

    .overview-list-item b {
      font-size: 13px;
      line-height: 1.2;
    }

    .overview-list-item span:last-child {
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
    }

    .caption-stop {
      display: grid;
      grid-template-columns: 24px auto;
      column-gap: 8px;
      align-items: center;
      min-width: max-content;
      padding: 7px 10px 7px 7px;
      border: 1px solid rgba(27, 42, 55, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 8px 22px rgba(17, 30, 42, 0.12);
      backdrop-filter: blur(14px);
      cursor: pointer;
    }

    .caption-stop:focus-visible {
      border-color: var(--teal);
      outline: none;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16), 0 8px 22px rgba(17, 30, 42, 0.12);
    }

    .caption-num {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--teal);
      color: #fff;
      font-size: 11px;
      font-weight: 860;
    }

    .caption-stop.start .caption-num { background: #1d4ed8; }
    .caption-stop.end .caption-num { background: var(--gold); }
    .caption-stop.transfer .caption-num { background: #7c3aed; }

    .caption-text {
      display: grid;
      gap: 1px;
    }

    .caption-text b {
      color: var(--ink);
      font-size: 12px;
      line-height: 1.15;
      font-weight: 820;
    }

    .caption-text span {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.1;
      font-weight: 720;
    }

    .day-button {
      min-width: 74px;
      min-height: 54px;
      padding: 8px;
      border: 1px solid rgba(27, 42, 55, 0.1);
      border-radius: 8px;
      background: rgba(248, 251, 252, 0.78);
      color: inherit;
      text-align: center;
      cursor: pointer;
      scroll-snap-align: start;
    }

    .day-button.active {
      border-color: rgba(15, 118, 110, 0.42);
      background: #edf8f5;
      box-shadow: inset 0 -3px 0 var(--teal);
    }

    .day-button.overview.active {
      border-color: rgba(164, 90, 19, 0.42);
      background: #fff7ed;
      box-shadow: inset 0 -3px 0 var(--gold);
    }

    .day-button.overview.scenic.active {
      border-color: rgba(15, 118, 110, 0.42);
      background: #edf8f5;
      box-shadow: inset 0 -3px 0 var(--teal);
    }

    .day-button b {
      display: block;
      color: var(--teal);
      font-size: 12px;
      line-height: 1.2;
    }

    .day-button span {
      display: none;
      margin-top: 6px;
      overflow: hidden;
      color: var(--ink);
      font-size: 11px;
      font-weight: 740;
      line-height: 1.25;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right { z-index: 7; }

    .maplibregl-ctrl-bottom-right { margin-bottom: 88px; }

    .maplibregl-ctrl-attrib .maplibregl-ctrl-attrib-inner {
      display: none !important;
    }

    .maplibregl-ctrl-attrib:hover .maplibregl-ctrl-attrib-inner,
    .maplibregl-ctrl-attrib:focus-within .maplibregl-ctrl-attrib-inner {
      display: block !important;
    }

    .stop-marker {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--teal);
      color: #fff;
      box-shadow: 0 10px 20px rgba(17, 30, 42, 0.25);
      font-size: 13px;
      font-weight: 860;
      opacity: 0;
      visibility: hidden;
      transition: opacity 160ms ease, visibility 160ms ease;
      z-index: 5;
    }

    .stop-marker.visible {
      opacity: 1;
      visibility: visible;
    }

    .stop-marker.bounce,
    .overview-marker.bounce {
      animation: marker-bounce 620ms cubic-bezier(0.2, 0.9, 0.2, 1.2);
    }

    .stop-marker.flight { background: var(--flight); }
    .stop-marker.start { background: #1d4ed8; }
    .stop-marker.end { background: var(--gold); }
    .stop-marker.scenic { background: var(--teal); }
    .stop-marker.transfer { background: #7c3aed; }

    .overview-marker {
      display: grid;
      grid-template-columns: auto auto;
      gap: 6px;
      align-items: center;
      padding: 5px 8px 5px 5px;
      border: 2px solid #fff;
      border-radius: 999px;
      background: var(--teal);
      color: #fff;
      box-shadow: 0 8px 18px rgba(17, 30, 42, 0.22);
      font-weight: 820;
      white-space: nowrap;
      z-index: 5;
    }

    .overview-marker.overnight { background: var(--gold); }

    .overview-marker span {
      display: grid;
      place-items: center;
      min-width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      font-size: 11px;
    }

    .overview-marker b {
      font-size: 12px;
      line-height: 1.1;
    }

    .distance-label {
      padding: 4px 7px;
      border: 1px solid rgba(27, 42, 55, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      box-shadow: 0 6px 14px rgba(17, 30, 42, 0.14);
      font-size: 11px;
      font-weight: 820;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0.88;
      z-index: 1;
    }

    @keyframes marker-bounce {
      0% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-18px) scale(1.16); }
      70% { transform: translateY(3px) scale(0.96); }
      100% { transform: translateY(0) scale(1); }
    }

    @media (min-width: 820px) {
      .top-card {
        right: auto;
        width: 390px;
      }

      .day-rail {
        right: 18px;
        bottom: 18px;
        left: 18px;
        border: 1px solid rgba(27, 42, 55, 0.12);
        border-radius: 8px;
      }

      .route-caption {
        right: 28px;
        bottom: 110px;
        left: 28px;
      }

      .overview-list {
        right: 28px;
        bottom: 182px;
        left: 28px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div id="map" aria-label="开源地图路线"></div>
    <div class="shade"></div>

    <section class="top-card" aria-live="polite">
      <div class="day-row">
        <span class="day-chip" id="dayChip">第1天</span>
        <span class="mode-pill" id="modePill">飞机</span>
      </div>
      <h1 id="dayTitle">抵达入住</h1>
      <p class="route-line" id="routeLine">无锡 → 石河子</p>
      <p class="stay-line" id="stayLine">夜宿：石河子</p>
      <div class="actions">
        <button class="control-button primary" id="detailButton" type="button">查看详情</button>
      </div>
      <div class="detail-sheet" id="detailSheet" aria-label="当天详情">
        <div class="sheet-head">
          <h2 id="sheetTitle">第1天 · 抵达入住</h2>
        </div>
        <p class="detail-route" id="detailRoute"></p>
        <p class="detail-desc" id="detailDesc"></p>
        <div class="night-box">
          <span id="nightLabel">当天晚上</span>
          <b id="nightPlace">石河子</b>
        </div>
        <div class="chips" id="chips"></div>
      </div>
    </section>

    <nav class="day-rail" id="dayRail" aria-label="选择行程天数"></nav>
    <div class="overview-list" id="overviewList" aria-label="汇总列表"></div>
    <div class="route-caption" id="routeCaption" aria-label="当天路线索引"></div>
  </main>

  <script>
    const colors = { flight: "#2563eb", car: "#c05a22", return: "#6d35c6" };
    const dayButtons = [];
    let tripData = null;
    let activeMarkers = [];
    let markerByKey = new Map();
    let activeIndex = 0;
    let overviewMode = false;
    let overviewKindActive = "";
    let overviewListOpen = false;
    let mapReady = false;
    let animationFrame = null;

    const openStreetMapStyle = {
      version: 8,
      sources: {
        osm: {
          type: "raster",
          tiles: [
            "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
            "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png",
            "https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"
          ],
          tileSize: 256,
          attribution: "© OpenStreetMap contributors"
        }
      },
      layers: [{
        id: "osm-raster",
        type: "raster",
        source: "osm",
        paint: { "raster-opacity": 0.9, "raster-saturation": -0.14, "raster-contrast": -0.04 }
      }]
    };

    const map = new maplibregl.Map({
      container: "map",
      style: openStreetMapStyle,
      center: [86.8, 43.7],
      zoom: 5.2,
      pitch: 0,
      attributionControl: false,
      renderWorldCopies: false
    });
    window.tripMap = map;
    map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-right");
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");

    function modeKey(item) {
      if (item.transportMode.includes("飞机") && item.day === 1) return "flight";
      if (item.movementType === "返程") return "return";
      return "car";
    }

    function stopCoords(item) {
      return item.numberedStops.map((stop) => stop.coord);
    }

    function coordinates(item) {
      return stopCoords(item);
    }

    function routeFeature(item, visibleCoords = null) {
      const mode = modeKey(item);
      return {
        type: "Feature",
        properties: { day: item.day, mode, color: colors[mode] },
        geometry: { type: "LineString", coordinates: visibleCoords || coordinates(item) }
      };
    }

    function collection(features = []) {
      return { type: "FeatureCollection", features };
    }

    function addMapLayers() {
      map.addSource("all-routes", { type: "geojson", data: collection(tripData.days.map((item) => routeFeature(item))) });
      map.addSource("active-route", { type: "geojson", data: collection() });

      map.addLayer({
        id: "all-routes-line",
        type: "line",
        source: "all-routes",
        paint: { "line-color": ["get", "color"], "line-width": 2, "line-opacity": 0 }
      });

      map.addLayer({
        id: "active-route-glow",
        type: "line",
        source: "active-route",
        paint: { "line-color": ["get", "color"], "line-width": 16, "line-opacity": 0.2, "line-blur": 4 }
      });

      map.addLayer({
        id: "active-route-line",
        type: "line",
        source: "active-route",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": ["get", "color"], "line-width": 7, "line-opacity": 0.98 }
      });
    }

    function clearActiveMarkers() {
      activeMarkers.forEach((marker) => marker.remove());
      activeMarkers = [];
      markerByKey = new Map();
    }

    function addMarkersForDay(item) {
      clearActiveMarkers();
      item.numberedStops.forEach((stop, index) => {
        const pin = document.createElement("div");
        const isFlight = stop.role.includes("乘机") || stop.role.includes("航班");
        const roleClass = stopClass(stop, index, item);
        pin.className = `stop-marker visible ${isFlight ? "flight" : ""} ${roleClass}`;
        pin.textContent = stop.order;
        pin.title = `${stop.order}. ${stop.name} - ${stop.role}`;
        addTrackedMarker(stopKey(stop, item.day), pin, stop.coord);
      });
      addSegmentDistanceLabels(item);
    }

    function addOverviewMarkers(items) {
      clearActiveMarkers();
      items.forEach((item) => {
        const pin = document.createElement("div");
        pin.className = `overview-marker ${item.kind === "overnight" ? "overnight" : ""}`;
        pin.innerHTML = `<span>${item.dayLabel}</span><b>${item.label}</b>`;
        pin.title = `${item.dayLabel} ${item.label}`;
        addTrackedMarker(item.key, pin, item.coord);
      });
    }

    function addTrackedMarker(key, element, coord) {
      const marker = new maplibregl.Marker({ element, anchor: "center" }).setLngLat(coord).addTo(map);
      activeMarkers.push(marker);
      markerByKey.set(key, { marker, element, coord });
      return marker;
    }

    function addSegmentDistanceLabels(item) {
      item.numberedStops.slice(1).forEach((stop, index) => {
        const previous = item.numberedStops[index];
        const label = document.createElement("div");
        label.className = "distance-label";
        label.textContent = `约${Math.round(distanceKm(previous.coord, stop.coord))}km`;
        label.title = `${previous.shortLabel || previous.name} 到 ${stop.shortLabel || stop.name} 的直线距离`;
        activeMarkers.push(new maplibregl.Marker({ element: label, anchor: "center" }).setLngLat(midpoint(previous.coord, stop.coord)).addTo(map));
      });
    }

    function stopClass(stop, index, item) {
      if (index === 0) return "start";
      if (index === item.numberedStops.length - 1) return "end";
      if (stop.role.includes("转场") || stop.role.includes("落脚") || stop.role.includes("晚餐")) return "transfer";
      return "scenic";
    }

    function renderRail() {
      const rail = document.getElementById("dayRail");
      tripData.days.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = "day-button";
        button.type = "button";
        button.innerHTML = `<b>D${item.day}</b>`;
        button.addEventListener("click", () => handleDayButton(index));
        rail.appendChild(button);
        dayButtons.push(button);
      });
      [
        { label: "打卡", kind: "scenic" },
        { label: "落脚", kind: "overnight" }
      ].forEach((entry) => {
        const overviewButton = document.createElement("button");
        overviewButton.className = `day-button overview ${entry.kind}`;
        overviewButton.type = "button";
        overviewButton.innerHTML = `<b>${entry.label}</b>`;
        overviewButton.addEventListener("click", () => showOverview(entry.kind));
        rail.appendChild(overviewButton);
        dayButtons.push(overviewButton);
      });
    }

    function routeText(item) {
      return item.numberedStops.map((stop) => stop.shortLabel || stop.name).join(" → ");
    }

    function updateText(item) {
      document.getElementById("detailButton").style.display = "";
      document.getElementById("dayChip").textContent = `第${item.day}天`;
      document.getElementById("modePill").textContent = item.transportMode;
      document.getElementById("dayTitle").textContent = item.focus;
      document.getElementById("routeLine").textContent = routeText(item);
      document.getElementById("stayLine").textContent = item.overnightLabel;
      document.getElementById("sheetTitle").textContent = `第${item.day}天 · ${item.focus}`;
      document.getElementById("detailRoute").textContent = item.routeSummary;
      document.getElementById("detailDesc").textContent = item.parentReminder;
      document.getElementById("nightLabel").textContent = item.day === 8 ? "返程" : "当天晚上";
      document.getElementById("nightPlace").textContent = item.eveningBase;
      document.getElementById("chips").innerHTML = [
        `早上：${item.morningStart}`,
        item.movementType,
        item.estimatedDriving,
        ...item.mainStops
      ].map((tag) => `<span class="chip">${tag}</span>`).join("");
      renderRouteCaption(item);
    }

    function renderRouteCaption(item) {
      document.getElementById("routeCaption").innerHTML = item.numberedStops.map((stop, index) => {
        const roleClass = stopClass(stop, index, item);
        return `
          <button class="caption-stop ${roleClass}" type="button" data-marker-key="${stopKey(stop, item.day)}">
            <span class="caption-num">${stop.order}</span>
            <span class="caption-text">
              <b>${stop.shortLabel || stop.name}</b>
              <span>${captionRole(stop, index, item)}</span>
            </span>
          </button>
        `;
      }).join("");
      bindCaptionInteractions();
    }

    function renderOverviewCaption(items) {
      document.getElementById("routeCaption").innerHTML = items.map((item) => `
        <button class="caption-stop ${item.kind === "overnight" ? "end" : "scenic"}" type="button" data-marker-key="${item.key}">
          <span class="caption-num">${item.dayLabel}</span>
          <span class="caption-text">
            <b>${item.label}</b>
            <span>${item.kind === "overnight" ? "落脚" : "打卡"}</span>
          </span>
        </button>
      `).join("");
      bindCaptionInteractions();
    }

    function captionRole(stop, index, item) {
      if (index === 0) return "出发";
      if (index === item.numberedStops.length - 1) return item.day === 8 ? "回家" : "落脚";
      if (stop.role.includes("晚餐")) return "晚餐";
      if (stop.role.includes("乘机") || stop.role.includes("航班")) return "航班";
      if (stop.role.includes("参观")) return "参观";
      return "游玩";
    }

    function boundsForCoords(coords) {
      return coords.reduce((bounds, coord) => bounds.extend(coord), new maplibregl.LngLatBounds(coords[0], coords[0]));
    }

    function selectDay(index) {
      if (!mapReady) return;
      overviewMode = false;
      overviewKindActive = "";
      overviewListOpen = false;
      activeIndex = index;
      const item = tripData.days[index];
      const coords = coordinates(item);

      updateText(item);
      renderOverviewList([]);
      addMarkersForDay(item);
      dayButtons.forEach((button, i) => button.classList.toggle("active", i === index));
      dayButtons[index]?.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      setDetailOpen(false);

      if (animationFrame) cancelAnimationFrame(animationFrame);
      animationFrame = null;
      showRoute(item, coords);
      moveMapToDay(item, coords);
    }

    function handleDayButton(index) {
      if (!mapReady) return;
      if (!overviewMode && activeIndex === index) {
        setDetailOpen(!document.getElementById("detailSheet").classList.contains("open"));
        return;
      }
      selectDay(index);
    }

    function showOverview(kind) {
      if (!mapReady) return;
      if (overviewMode && overviewKindActive === kind) {
        overviewListOpen = !overviewListOpen;
        document.getElementById("overviewList").classList.toggle("open", overviewListOpen);
        return;
      }
      overviewMode = true;
      overviewKindActive = kind;
      overviewListOpen = true;
      setDetailOpen(false);
      const items = overviewItems(kind);

      document.getElementById("dayChip").textContent = kind === "scenic" ? "打卡" : "落脚";
      document.getElementById("modePill").textContent = kind === "scenic" ? "景点汇总" : "夜宿汇总";
      document.getElementById("dayTitle").textContent = kind === "scenic" ? "全程打卡" : "全程落脚";
      document.getElementById("detailButton").style.display = "none";
      document.getElementById("routeLine").textContent = "";
      document.getElementById("stayLine").textContent = "";
      renderOverviewCaption(items);
      renderOverviewList(items);
      addOverviewMarkers(items);
      const activeButtonIndex = kind === "scenic" ? tripData.days.length : tripData.days.length + 1;
      dayButtons.forEach((button, i) => button.classList.toggle("active", i === activeButtonIndex));
      dayButtons[activeButtonIndex]?.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      map.getSource("active-route").setData(collection());
      fitMapToCoords(items.map((item) => item.coord), 7.2);
    }

    function renderOverviewList(items) {
      const list = document.getElementById("overviewList");
      list.innerHTML = items.map((item) => `
        <button class="overview-list-item ${item.kind === "overnight" ? "overnight" : ""}" type="button" data-marker-key="${item.key}">
          <span class="days">${item.dayLabel}</span>
          <b>${item.label}</b>
          <span>${item.kind === "overnight" ? "落脚" : "打卡"}</span>
        </button>
      `).join("");
      list.classList.toggle("open", overviewListOpen && items.length > 0);
      list.querySelectorAll(".overview-list-item").forEach((button) => {
        button.addEventListener("click", () => focusMarker(button.dataset.markerKey));
      });
    }

    function bindCaptionInteractions() {
      document.querySelectorAll(".caption-stop").forEach((button) => {
        button.addEventListener("click", () => focusMarker(button.dataset.markerKey));
      });
    }

    function focusMarker(key) {
      const entry = markerByKey.get(key);
      if (!entry) return;
      const element = entry.element;
      element.style.zIndex = String(Date.now());
      element.classList.remove("bounce");
      void element.offsetWidth;
      element.classList.add("bounce");
      map.easeTo({
        center: entry.coord,
        duration: 450,
        essential: true
      });
      setTimeout(() => element.classList.remove("bounce"), 700);
    }

    function showRoute(item, coords) {
      map.getSource("active-route").setData(collection([routeFeature(item, coords)]));
    }

    function moveMapToDay(item, coords) {
      map.easeTo({
        center: centerOfCoords(coords),
        zoom: fixedZoom(modeKey(item) === "flight" || modeKey(item) === "return"),
        duration: 650,
        essential: true
      });
    }

    function fitMapToDay(item, coords) {
      fitMapToCoords(coords, modeKey(item) === "flight" || modeKey(item) === "return" ? 5.25 : 8.4);
    }

    function fitMapToCoords(coords, maxZoom = 8.4) {
      map.fitBounds(boundsForCoords(coords), {
        padding: mapPadding(),
        maxZoom,
        duration: 650,
        essential: true
      });
    }

    function mapPadding() {
      const cardHeight = Math.ceil(document.querySelector(".top-card").getBoundingClientRect().height) + 22;
      return window.innerWidth < 820
        ? { top: cardHeight, right: 34, bottom: 156, left: 34 }
        : { top: cardHeight, right: 90, bottom: 112, left: 430 };
    }

    function centerOfCoords(coords) {
      return [
        coords.reduce((sum, coord) => sum + coord[0], 0) / coords.length,
        coords.reduce((sum, coord) => sum + coord[1], 0) / coords.length
      ];
    }

    function fixedZoom(flightDay) {
      if (flightDay) return window.innerWidth < 820 ? 3.05 : 3.65;
      return window.innerWidth < 820 ? 5.55 : 5.95;
    }

    function overviewItems(kind) {
      const grouped = new Map();
      tripData.days.flatMap((day) => overviewItemsForDay(day).filter((item) => item.kind === kind)).forEach((item) => {
        const key = [item.kind, item.label, item.coord.map((value) => value.toFixed(4)).join(",")].join("|");
        if (!grouped.has(key)) {
          grouped.set(key, { ...item, days: [item.day] });
        } else {
          grouped.get(key).days.push(item.day);
        }
      });
      return [...grouped.values()].map((item) => ({
        ...item,
        dayLabel: item.days.map((day) => `D${day}`).join("/"),
        key: [item.kind, item.label, item.coord.map((value) => value.toFixed(4)).join(",")].join("|")
      }));
    }

    function overviewItemsForDay(day) {
      const start = day.numberedStops[0];
      return day.numberedStops
        .filter((stop, index) => index > 0 && overviewKind(stop, index, day))
        .map((stop, index) => ({
          day: day.day,
          dayLabel: `D${day.day}`,
          label: overviewKind(stop, day.numberedStops.indexOf(stop), day) === "overnight"
            ? overnightCityLabel(day)
            : stop.shortLabel || stop.name,
          coord: stop.coord,
          from: start,
          kind: overviewKind(stop, day.numberedStops.indexOf(stop), day),
          distanceKm: distanceKm(start.coord, stop.coord),
          key: overviewKey(stop, day.day, overviewKind(stop, day.numberedStops.indexOf(stop), day))
        }));
    }

    function overviewKind(stop, index, day) {
      if (stop.role.includes("回家")) return "";
      if (index === day.numberedStops.length - 1) return "overnight";
      if (stop.role.includes("乘机") || stop.role.includes("航班")) return "";
      if (index > 0) return "scenic";
      return "";
    }

    function overnightCityLabel(day) {
      return day.overnightLabel.replace(/^夜宿：/, "").replace(/^返程：/, "");
    }

    function distanceKm(a, b) {
      const toRad = (value) => value * Math.PI / 180;
      const [lng1, lat1] = a;
      const [lng2, lat2] = b;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const x = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 6371 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }

    function midpoint(a, b) {
      return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    }

    function stopKey(stop, day) {
      return `day-${day}-stop-${stop.order}`;
    }

    function overviewKey(stop, day, kind) {
      return `${kind}|${stop.shortLabel || stop.name}|${stop.coord.map((value) => value.toFixed(4)).join(",")}`;
    }

    async function init() {
      const response = await fetch("data/itinerary-structured.json");
      tripData = await response.json();
      addMapLayers();
      renderRail();
      mapReady = true;
      selectDay(0);
    }

    map.on("load", () => {
      init().catch((error) => {
        console.error(error);
        document.getElementById("dayTitle").textContent = "行程数据加载失败";
        document.getElementById("routeLine").textContent = "请检查 data/itinerary-structured.json";
      });
    });

    function setDetailOpen(open) {
      document.querySelector(".top-card").classList.toggle("expanded", open);
      document.getElementById("detailSheet").classList.toggle("open", open);
      document.getElementById("detailButton").textContent = open ? "关闭详情" : "查看详情";
      if (!mapReady || !tripData) return;
      if (overviewMode) return;
      const item = tripData.days[activeIndex];
      const coords = coordinates(item);
      requestAnimationFrame(() => {
        fitMapToDay(item, coords);
      });
    }

    document.getElementById("detailButton").addEventListener("click", () => {
      setDetailOpen(!document.getElementById("detailSheet").classList.contains("open"));
    });
    window.addEventListener("resize", () => { if (mapReady) map.resize(); });
  </script>
</body>
</html>
