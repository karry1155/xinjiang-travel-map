<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新疆 8 日行程调度图</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #64717f;
      --line: #d7e0e8;
      --panel: #ffffff;
      --soft: #f3f6f8;
      --teal: #0f766e;
      --teal-2: #115e59;
      --blue: #2563eb;
      --orange: #c05621;
      --purple: #6d28d9;
      --green: #15803d;
      --shadow: 0 18px 44px rgba(24, 39, 54, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      color: var(--ink);
      background: var(--soft);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    .app {
      width: 100%;
      max-width: 100vw;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(360px, 430px) minmax(0, 1fr);
      overflow: hidden;
    }

    .sidebar {
      min-width: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--line);
      box-shadow: var(--shadow);
      z-index: 2;
    }

    .header {
      padding: 24px 24px 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 780;
    }

    .summary {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 18px;
    }

    .stat {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }

    .stat b,
    .stat span {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stat b {
      font-size: 17px;
      line-height: 1.2;
    }

    .stat span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .days {
      overflow: auto;
      padding: 14px 14px 22px;
    }

    .day-card {
      width: 100%;
      min-width: 0;
      padding: 14px;
      margin: 0 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, box-shadow 160ms ease,
        transform 160ms ease;
    }

    .day-card:hover,
    .day-card:focus-visible {
      border-color: rgba(15, 118, 110, 0.55);
      box-shadow: 0 10px 28px rgba(25, 55, 70, 0.12);
      outline: none;
      transform: translateY(-1px);
    }

    .day-card.active {
      border-color: var(--teal);
      box-shadow: inset 4px 0 0 var(--teal), 0 10px 28px rgba(25, 55, 70, 0.1);
    }

    .day-top {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      color: #fff;
      background: var(--teal);
      font-size: 13px;
      font-weight: 760;
    }

    .theme {
      min-width: 0;
      color: #a74717;
      font-size: 13px;
      font-weight: 760;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .route {
      margin: 11px 0 8px;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 760;
    }

    .desc,
    .stay {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .stay {
      margin-top: 6px;
      color: var(--teal-2);
      font-weight: 700;
    }

    .spots {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .spot {
      max-width: 100%;
      padding: 5px 8px;
      border-radius: 6px;
      background: #eef6f5;
      color: var(--teal-2);
      font-size: 12px;
      font-weight: 680;
    }

    .map-stage {
      min-width: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: #e8eef2;
    }

    .map-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid #cfd9e2;
      background: rgba(255, 255, 255, 0.92);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .legend-item {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      white-space: nowrap;
    }

    .legend-line {
      width: 30px;
      height: 0;
      border-top: 4px solid var(--orange);
      border-radius: 999px;
    }

    .legend-line.flight {
      border-color: var(--blue);
      border-top-style: dashed;
    }

    .legend-dot {
      width: 14px;
      height: 14px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 1px rgba(31, 41, 51, 0.18);
    }

    .overview-button {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 720;
      cursor: pointer;
    }

    .overview-button:hover,
    .overview-button:focus-visible {
      border-color: var(--teal);
      outline: none;
    }

    .map-wrap {
      min-height: 0;
      padding: 18px;
      overflow: auto;
    }

    .route-map {
      display: block;
      width: 100%;
      min-width: 820px;
      height: auto;
      border: 1px solid #cfd9e2;
      border-radius: 8px;
      background: #f8fbfc;
      box-shadow: 0 14px 34px rgba(24, 39, 54, 0.12);
    }

    .land {
      fill: #edf3ef;
      stroke: #b8c7bd;
      stroke-width: 2;
    }

    .province {
      fill: none;
      stroke: #d0dad3;
      stroke-width: 1.4;
      stroke-dasharray: 5 8;
    }

    .water {
      fill: #cfe7ef;
      stroke: #9fc4d2;
      stroke-width: 1.2;
    }

    .mountain {
      fill: none;
      stroke: #d5c3aa;
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0.7;
    }

    .route-path {
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.28;
      transition: opacity 160ms ease, stroke-width 160ms ease, filter 160ms ease;
    }

    .route-path.flight {
      stroke: var(--blue);
      stroke-dasharray: 12 14;
    }

    .route-path.car {
      stroke: var(--orange);
    }

    .route-path.return {
      stroke: var(--purple);
      stroke-dasharray: 12 14;
    }

    .route-path.active {
      opacity: 1;
      stroke-width: 10;
      filter: drop-shadow(0 8px 8px rgba(31, 41, 51, 0.18));
    }

    .route-path.overview {
      opacity: 0.78;
    }

    .route-path.dim {
      opacity: 0.14;
    }

    .node {
      cursor: pointer;
    }

    .node circle {
      fill: #fff;
      stroke: var(--teal);
      stroke-width: 4;
      transition: stroke-width 160ms ease, fill 160ms ease, opacity 160ms ease;
    }

    .node.flight-node circle {
      stroke: var(--blue);
    }

    .node.night circle {
      fill: #fff8e8;
      stroke: #a74717;
    }

    .node.active circle {
      fill: var(--teal);
      stroke-width: 6;
    }

    .node.active text,
    .node.active .pin-icon {
      fill: #fff;
    }

    .node.dim {
      opacity: 0.38;
    }

    .pin-icon {
      fill: var(--teal-2);
      font-size: 15px;
      font-weight: 900;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .label {
      fill: #253241;
      font-size: 20px;
      font-weight: 760;
      paint-order: stroke;
      stroke: rgba(248, 251, 252, 0.9);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .small-label {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 680;
      paint-order: stroke;
      stroke: rgba(248, 251, 252, 0.9);
      stroke-width: 4;
      stroke-linejoin: round;
    }

    .day-tag {
      fill: #fff;
      font-size: 15px;
      font-weight: 820;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .stay-card {
      fill: #ffffff;
      stroke: #d7e0e8;
      stroke-width: 1.5;
      filter: drop-shadow(0 8px 14px rgba(24, 39, 54, 0.11));
    }

    .stay-title {
      fill: #a74717;
      font-size: 15px;
      font-weight: 820;
    }

    .stay-place {
      fill: #253241;
      font-size: 17px;
      font-weight: 760;
    }

    .info-panel {
      position: absolute;
      right: 34px;
      bottom: 34px;
      width: min(360px, calc(100vw - 48px));
      padding: 14px 16px;
      border: 1px solid rgba(207, 217, 226, 0.92);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 14px 34px rgba(24, 39, 54, 0.14);
    }

    .map-shell {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    .info-panel h2 {
      margin: 0 0 7px;
      font-size: 17px;
      line-height: 1.3;
    }

    .info-panel p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    @media (max-width: 900px) {
      .app {
        width: 100vw;
        grid-template-columns: 1fr;
        grid-template-rows: 55vh 45vh;
      }

      .map-stage {
        grid-row: 1;
        height: 55vh;
      }

      .sidebar {
        grid-row: 2;
        height: 45vh;
        border-top: 1px solid var(--line);
        border-right: 0;
      }

      .header {
        padding: 16px 16px 12px;
      }

      h1 {
        font-size: 22px;
      }

      .stats {
        margin-top: 12px;
      }

      .days {
        padding: 10px;
      }

      .map-toolbar {
        padding: 10px 12px;
      }

      .map-wrap {
        width: 100%;
        max-width: 100vw;
        min-width: 0;
        padding: 10px;
      }

      .route-map {
        min-width: 760px;
      }

      .info-panel {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar" aria-label="行程列表">
      <section class="header">
        <h1>新疆 8 日行程调度图</h1>
        <p class="summary">一张总图看全程：蓝色虚线是航班，橙色实线是车程，带“夜”标记的是当天晚上大致停留地。</p>
        <div class="stats" aria-label="行程概览">
          <div class="stat"><b>8 天</b><span>完整行程</span></div>
          <div class="stat"><b>2 程</b><span>往返航班</span></div>
          <div class="stat"><b>7 晚</b><span>夜宿调度</span></div>
        </div>
      </section>
      <section class="days" id="days"></section>
    </aside>

    <section class="map-stage" aria-label="行程路线总图">
      <div class="map-toolbar">
        <div class="legend" aria-label="图例">
          <span class="legend-item"><span class="legend-line flight"></span>飞机线</span>
          <span class="legend-item"><span class="legend-line"></span>汽车线</span>
          <span class="legend-item"><span class="legend-dot"></span>夜宿点</span>
        </div>
        <button class="overview-button" id="overviewButton" type="button">查看全程总览</button>
      </div>
      <div class="map-shell">
        <div class="map-wrap">
          <svg class="route-map" id="routeMap" viewBox="0 0 1200 760" role="img" aria-label="新疆 8 日旅行路线调度图">
            <defs>
              <marker id="arrowCar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#c05621"></path>
              </marker>
              <marker id="arrowFlight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"></path>
              </marker>
              <marker id="arrowReturn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"></path>
              </marker>
            </defs>

            <rect x="0" y="0" width="1200" height="760" fill="#f8fbfc"></rect>
            <path class="land" d="M92,166 L182,95 L329,70 L474,96 L574,82 L705,126 L842,105 L965,170 L1009,266 L970,363 L1018,479 L930,591 L764,632 L646,682 L507,644 L365,674 L241,623 L132,537 L91,395 L48,281 Z"></path>
            <path class="province" d="M210,130 C315,204 455,196 555,160 C672,118 822,162 934,236"></path>
            <path class="province" d="M132,514 C260,456 374,451 470,492 C584,539 702,516 818,442 C879,402 938,387 990,399"></path>
            <path class="mountain" d="M220,570 C340,526 430,544 520,582 C640,632 728,575 850,536"></path>
            <path class="mountain" d="M468,236 C560,194 660,198 754,231 C836,260 907,255 971,223"></path>
            <ellipse class="water" cx="223" cy="336" rx="68" ry="32"></ellipse>
            <ellipse class="water" cx="833" cy="244" rx="30" ry="17"></ellipse>
            <text class="label" x="80" y="70">新疆路线主图</text>
            <text class="small-label" x="82" y="100">所有交通动线保持在同一张图里，点击左侧天数只做高亮</text>
            <text class="small-label" x="980" y="690">无锡航班端点</text>
            <text class="small-label" x="980" y="714">进出疆航班从这里连接石河子</text>

            <g id="paths"></g>
            <g id="nodes"></g>
            <g id="stays"></g>
          </svg>
        </div>

        <aside class="info-panel" id="infoPanel" aria-live="polite">
          <h2>全程总览</h2>
          <p>蓝色虚线从无锡飞到石河子；中间以汽车线串起赛里木湖、伊犁草原、奎屯、乌鲁木齐、天山天池、南山牧场；最后紫色虚线从石河子返程。</p>
        </aside>
      </div>
    </section>
  </main>

      dushanzi: [14, 28],
      urumqi: [18, 3],
      tianchi: [18, -10],
      nanshan: [18, 24]
    };

    const infoPanel = document.getElementById("infoPanel");
    const pathsGroup = document.getElementById("paths");
    const nodesGroup = document.getElementById("nodes");
    const staysGroup = document.getElementById("stays");
    const dayButtons = [];

    function pathData(keys, mode) {
      const points = keys.map((key) => places[key]);
      if (mode === "flight") {
        const [start, end] = points;
        return `M ${start.x} ${start.y} C 970 365, 830 180, ${end.x} ${end.y}`;
      }
      if (mode === "return") {
        const [start, mid, end] = points;
        return `M ${start.x} ${start.y} L ${mid.x} ${mid.y} C 820 190, 972 376, ${end.x} ${end.y}`;
      }
      return points.map((point, index) => `${index === 0 ? "M" : "L"} ${point.x} ${point.y}`).join(" ");
    }

    function markerFor(mode) {
      if (mode === "flight") return "url(#arrowFlight)";
      if (mode === "return") return "url(#arrowReturn)";
      return "url(#arrowCar)";
    }

    function renderCards() {
      const days = document.getElementById("days");
      itinerary.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = "day-card";
        button.type = "button";
        button.innerHTML = `
          <div class="day-top">
            <span class="badge">第${item.day}天</span>
            <span class="theme">${item.theme}</span>
          </div>
          <div class="route">${item.route}</div>
          <p class="desc">${item.desc}</p>
          <p class="stay">${item.stay}</p>
          <div class="spots">${item.spots.map((spot) => `<span class="spot">${spot}</span>`).join("")}</div>
        `;
        button.addEventListener("click", () => focusDay(index));
        days.appendChild(button);
        dayButtons.push(button);
      });
    }

    function renderPaths() {
      itinerary.forEach((item) => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pathData(item.path, item.mode));
        path.setAttribute("class", `route-path ${item.mode}`);
        path.setAttribute("data-day", item.day);
        path.setAttribute("marker-end", markerFor(item.mode));
        path.addEventListener("click", () => focusDay(item.day - 1));
        pathsGroup.appendChild(path);
      });
    }

    function renderNodes() {
      Object.entries(places).forEach(([key, place]) => {
        const usedBy = itinerary
          .filter((item) => item.path.includes(key))
          .map((item) => item.day);
        const [dx, dy] = labelOffsets[key] || [16, -12];
        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        group.setAttribute("class", `node ${place.kind === "flight" ? "flight-node" : ""}`);
        group.setAttribute("data-place", key);
        group.setAttribute("data-days", usedBy.join(","));
        group.setAttribute("transform", `translate(${place.x} ${place.y})`);
        group.innerHTML = `
          <circle r="16"></circle>
          <text class="pin-icon" y="1">${place.kind === "flight" ? "机" : "点"}</text>
          <text class="label" x="${dx}" y="${dy}">${place.name}</text>
        `;
        if (usedBy.length) {
          group.addEventListener("click", () => focusDay(usedBy[0] - 1));
        }
        nodesGroup.appendChild(group);
      });
    }

    function renderStayCards() {
      itinerary.forEach((item) => {
        const card = document.createElementNS("http://www.w3.org/2000/svg", "g");
        card.setAttribute("data-day", item.day);
        card.setAttribute("class", "stay-card-group");
        const cardTitle = item.day === 8 ? "第8天 · 返程" : `第${item.day}天 · 夜宿`;
        card.innerHTML = `
          <rect class="stay-card" x="${item.card.x}" y="${item.card.y}" width="184" height="64" rx="8"></rect>
          <text class="stay-title" x="${item.card.x + 14}" y="${item.card.y + 24}">${cardTitle}</text>
          <text class="stay-place" x="${item.card.x + 14}" y="${item.card.y + 49}">${item.stay.replace("夜宿：", "").replace("返程：", "")}</text>
        `;
        card.addEventListener("click", () => focusDay(item.day - 1));
        staysGroup.appendChild(card);
      });
    }

    function focusDay(index) {
      const item = itinerary[index];
      const activePlaces = new Set(item.path);

      dayButtons.forEach((button, buttonIndex) => {
        button.classList.toggle("active", buttonIndex === index);
      });

      document.querySelectorAll(".route-path").forEach((path) => {
        const isActive = Number(path.dataset.day) === item.day;
        path.classList.toggle("active", isActive);
        path.classList.toggle("dim", !isActive);
        path.classList.remove("overview");
      });

      document.querySelectorAll(".node").forEach((node) => {
        const isActive = activePlaces.has(node.dataset.place);
        node.classList.toggle("active", isActive);
        node.classList.toggle("dim", !isActive);
      });

      document.querySelectorAll(".stay-card-group").forEach((card) => {
        const isActive = Number(card.dataset.day) === item.day;
        card.style.opacity = isActive ? "1" : "0.36";
      });

      infoPanel.innerHTML = `
        <h2>第${item.day}天 · ${item.theme}</h2>
        <p>${item.route}</p>
        <p>${item.desc}</p>
        <p>${item.stay}</p>
      `;
    }

    function showOverview() {
      dayButtons.forEach((button) => button.classList.remove("active"));
      document.querySelectorAll(".route-path").forEach((path) => {
        path.classList.remove("active", "dim");
        path.classList.add("overview");
      });
      document.querySelectorAll(".node").forEach((node) => {
        node.classList.remove("active", "dim");
      });
      document.querySelectorAll(".stay-card-group").forEach((card) => {
        card.style.opacity = "1";
      });
      infoPanel.innerHTML = `
        <h2>全程总览</h2>
        <p>从无锡飞石河子后，汽车线依次经过赛里木湖、果子沟、伊犁草原、奎屯、独山子、乌鲁木齐、天山天池、南山牧场，最后回石河子飞无锡。</p>
      `;
    }

    renderCards();
    renderPaths();
    renderNodes();
    renderStayCards();
    showOverview();
    document.getElementById("overviewButton").addEventListener("click", showOverview);
  </script>
</body>
</html>
