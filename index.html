<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>新疆 8 日路线地图</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --ink: #17212b;
      --muted: #667483;
      --panel: rgba(255, 255, 255, 0.94);
      --line: rgba(27, 42, 55, 0.14);
      --teal: #0f766e;
      --road: #c05a22;
      --flight: #2563eb;
      --return: #6d35c6;
      --gold: #a45a13;
      --shadow: 0 18px 46px rgba(17, 30, 42, 0.18);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      background: #edf3f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button { font: inherit; }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #dce8ee;
    }

    .shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(237, 243, 246, 0.94),
        rgba(237, 243, 246, 0.18) 150px,
        rgba(237, 243, 246, 0) calc(100% - 170px),
        rgba(237, 243, 246, 0.95)
      );
    }

    .top-card {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      left: 12px;
      z-index: 5;
      padding: 14px;
      border: 1px solid rgba(27, 42, 55, 0.12);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .top-card.expanded {
      max-height: calc(100vh - 112px);
      overflow-y: auto;
    }

    .day-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .day-chip {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: #e7f6f3;
      color: var(--teal);
      font-size: 13px;
      font-weight: 820;
      white-space: nowrap;
    }

    .mode-pill {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }

    .top-card h1 {
      margin: 9px 0 6px;
      font-size: 22px;
      line-height: 1.18;
      font-weight: 840;
    }

    .route-line {
      display: none;
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
      font-weight: 760;
    }

    .stay-line {
      display: none;
      margin: 8px 0 0;
      color: #95530f;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 780;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .control-button {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(27, 42, 55, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 780;
    }

    .control-button.primary {
      border-color: rgba(15, 118, 110, 0.5);
      background: var(--teal);
      color: #fff;
    }

    .control-button:hover,
    .control-button:focus-visible {
      border-color: var(--teal);
      outline: none;
    }

    .detail-sheet {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .detail-sheet.open { display: block; }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .sheet-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .detail-route {
      margin: 0;
      font-size: 15px;
      line-height: 1.55;
      font-weight: 760;
    }

    .detail-desc {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .night-box {
      margin-top: 14px;
      padding: 12px 13px;
      border: 1px solid rgba(164, 90, 19, 0.22);
      border-radius: 8px;
      background: #fff8ed;
    }

    .night-box span {
      display: block;
      color: #934f0f;
      font-size: 12px;
      font-weight: 820;
    }

    .night-box b {
      display: block;
      margin-top: 4px;
      font-size: 16px;
      line-height: 1.35;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .chip {
      padding: 6px 9px;
      border-radius: 7px;
      background: #edf6f4;
      color: #155e57;
      font-size: 12px;
      font-weight: 740;
    }

    .day-rail {
      position: absolute;
      right: 0;
      bottom: env(safe-area-inset-bottom);
      left: 0;
      z-index: 5;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 74px;
      gap: 8px;
      padding: 10px 12px 12px;
      border-top: 1px solid rgba(27, 42, 55, 0.12);
      background: rgba(255, 255, 255, 0.93);
      box-shadow: 0 -12px 34px rgba(17, 30, 42, 0.12);
      backdrop-filter: blur(16px);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
    }

    .day-button {
      min-width: 74px;
      min-height: 54px;
      padding: 8px;
      border: 1px solid rgba(27, 42, 55, 0.1);
      border-radius: 8px;
      background: rgba(248, 251, 252, 0.78);
      color: inherit;
      text-align: center;
      cursor: pointer;
      scroll-snap-align: start;
    }

    .day-button.active {
      border-color: rgba(15, 118, 110, 0.42);
      background: #edf8f5;
      box-shadow: inset 0 -3px 0 var(--teal);
    }

    .day-button b {
      display: block;
      color: var(--teal);
      font-size: 12px;
      line-height: 1.2;
    }

    .day-button span {
      display: none;
      margin-top: 6px;
      overflow: hidden;
      color: var(--ink);
      font-size: 11px;
      font-weight: 740;
      line-height: 1.25;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right { z-index: 7; }

    .maplibregl-ctrl-bottom-right { margin-bottom: 88px; }

    .stop-marker {
      position: relative;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--teal);
      color: #fff;
      box-shadow: 0 10px 20px rgba(17, 30, 42, 0.25);
      font-size: 13px;
      font-weight: 860;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.82);
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms ease;
    }

    .stop-marker.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .stop-marker.flight { background: var(--flight); }
    .stop-marker.start { background: #1d4ed8; }
    .stop-marker.end { background: var(--gold); }
    .stop-marker.scenic { background: var(--teal); }
    .stop-marker.transfer { background: #7c3aed; }

    .stop-marker.offset-left::after,
    .stop-marker.offset-right::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 30px;
      border-top: 2px dashed rgba(23, 33, 43, 0.46);
    }

    .stop-marker.offset-left::after {
      left: 100%;
    }

    .stop-marker.offset-right::after {
      right: 100%;
    }

    .stop-label {
      position: relative;
      min-width: auto;
      max-width: 120px;
      padding: 7px 10px;
      border: 0;
      border-radius: 8px;
      background: var(--teal);
      box-shadow: 0 10px 22px rgba(17, 30, 42, 0.14);
      color: #fff;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 160ms ease, visibility 160ms ease;
    }

    .stop-label.visible {
      opacity: 1;
      visibility: visible;
    }

    .stop-label::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -18px;
      width: 0;
      height: 18px;
      border-left: 2px dashed rgba(23, 33, 43, 0.44);
      transform: translateX(-50%);
    }

    .stop-label span {
      display: none;
      color: rgba(255, 255, 255, 0.78);
      font-size: 11px;
      font-weight: 780;
    }

    .stop-label b {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.25;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .stop-label.start { background: #1d4ed8; }
    .stop-label.scenic { background: var(--teal); }
    .stop-label.transfer { background: #7c3aed; }
    .stop-label.end { background: var(--gold); }

    @media (min-width: 820px) {
      .top-card {
        right: auto;
        width: 390px;
      }

      .day-rail {
        right: 18px;
        bottom: 18px;
        left: 18px;
        border: 1px solid rgba(27, 42, 55, 0.12);
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div id="map" aria-label="开源地图路线"></div>
    <div class="shade"></div>

    <section class="top-card" aria-live="polite">
      <div class="day-row">
        <span class="day-chip" id="dayChip">第1天</span>
        <span class="mode-pill" id="modePill">飞机</span>
      </div>
      <h1 id="dayTitle">抵达入住</h1>
      <p class="route-line" id="routeLine">无锡 → 石河子</p>
      <p class="stay-line" id="stayLine">夜宿：石河子</p>
      <div class="actions">
        <button class="control-button primary" id="detailButton" type="button">查看详情</button>
      </div>
      <div class="detail-sheet" id="detailSheet" aria-label="当天详情">
        <div class="sheet-head">
          <h2 id="sheetTitle">第1天 · 抵达入住</h2>
        </div>
        <p class="detail-route" id="detailRoute"></p>
        <p class="detail-desc" id="detailDesc"></p>
        <div class="night-box">
          <span id="nightLabel">当天晚上</span>
          <b id="nightPlace">石河子</b>
        </div>
        <div class="chips" id="chips"></div>
      </div>
    </section>

    <nav class="day-rail" id="dayRail" aria-label="选择行程天数"></nav>
  </main>

  <script>
    const colors = { flight: "#2563eb", car: "#c05a22", return: "#6d35c6" };
    const dayButtons = [];
    let tripData = null;
    let activeMarkers = [];
    let activeIndex = 0;
    let mapReady = false;
    let animationFrame = null;

    const openStreetMapStyle = {
      version: 8,
      sources: {
        osm: {
          type: "raster",
          tiles: [
            "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
            "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png",
            "https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"
          ],
          tileSize: 256,
          attribution: "© OpenStreetMap contributors"
        }
      },
      layers: [{
        id: "osm-raster",
        type: "raster",
        source: "osm",
        paint: { "raster-opacity": 0.9, "raster-saturation": -0.14, "raster-contrast": -0.04 }
      }]
    };

    const map = new maplibregl.Map({
      container: "map",
      style: openStreetMapStyle,
      center: [86.8, 43.7],
      zoom: 5.2,
      pitch: 0,
      attributionControl: true,
      renderWorldCopies: false
    });
    window.tripMap = map;
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");

    function modeKey(item) {
      if (item.transportMode.includes("飞机") && item.day === 1) return "flight";
      if (item.movementType === "返程") return "return";
      return "car";
    }

    function stopCoords(item) {
      return item.numberedStops.map((stop) => stop.coord);
    }

    function coordinates(item) {
      const raw = stopCoords(item);
      const mode = modeKey(item);
      if (mode === "flight") {
        if (raw.length > 2) return [...straightLine(raw[0], raw[1], 16), ...curvedLine(raw[1], raw[raw.length - 1], 84).slice(1)];
        return curvedLine(raw[0], raw[1], 84);
      }
      if (mode === "return") {
        if (raw.length > 2) return [...curvedLine(raw[0], raw[1], 84), ...straightLine(raw[1], raw[2], 16).slice(1)];
        return curvedLine(raw[0], raw[1], 84);
      }
      return raw.flatMap((point, index) => index === 0 ? [point] : straightLine(raw[index - 1], point, 24).slice(1));
    }

    function straightLine(a, b, steps) {
      return Array.from({ length: steps + 1 }, (_, i) => {
        const t = i / steps;
        return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      });
    }

    function curvedLine(a, b, steps) {
      const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + Math.abs(a[0] - b[0]) * 0.12];
      return Array.from({ length: steps + 1 }, (_, i) => {
        const t = i / steps;
        const x = (1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * mid[0] + t * t * b[0];
        const y = (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * mid[1] + t * t * b[1];
        return [x, y];
      });
    }

    function routeFeature(item, visibleCoords = null) {
      const mode = modeKey(item);
      return {
        type: "Feature",
        properties: { day: item.day, mode, color: colors[mode] },
        geometry: { type: "LineString", coordinates: visibleCoords || coordinates(item) }
      };
    }

    function collection(features = []) {
      return { type: "FeatureCollection", features };
    }

    function addMapLayers() {
      map.addSource("all-routes", { type: "geojson", data: collection(tripData.days.map((item) => routeFeature(item))) });
      map.addSource("active-route", { type: "geojson", data: collection() });

      map.addLayer({
        id: "all-routes-line",
        type: "line",
        source: "all-routes",
        paint: { "line-color": ["get", "color"], "line-width": 2, "line-opacity": 0.14 }
      });

      map.addLayer({
        id: "active-route-glow",
        type: "line",
        source: "active-route",
        paint: { "line-color": ["get", "color"], "line-width": 12, "line-opacity": 0.16, "line-blur": 3 }
      });

      map.addLayer({
        id: "active-route-line",
        type: "line",
        source: "active-route",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": ["get", "color"], "line-width": 6, "line-opacity": 0.96 }
      });
    }

    function clearActiveMarkers() {
      activeMarkers.forEach((marker) => marker.remove());
      activeMarkers = [];
    }

    function addMarkersForDay(item) {
      clearActiveMarkers();
      const renderedLabels = new Set();
      item.numberedStops.forEach((stop, index) => {
        const offset = markerOffset(stop, index, item);
        const pin = document.createElement("div");
        const isFlight = stop.role.includes("乘机") || stop.role.includes("航班");
        const roleClass = stopClass(stop, index, item);
        pin.className = `stop-marker visible ${isFlight ? "flight" : ""} ${roleClass} ${offsetClass(stop)}`;
        pin.textContent = stop.order;
        pin.title = stop.name;
        activeMarkers.push(new maplibregl.Marker({ element: pin, anchor: "center", offset }).setLngLat(stop.coord).addTo(map));

        const label = document.createElement("div");
        label.className = `stop-label visible ${roleClass}`;
        const labelText = stop.shortLabel || stop.name;
        if (!renderedLabels.has(labelText)) {
          renderedLabels.add(labelText);
          label.innerHTML = `<span>${stop.role}</span><b>${labelText}</b>`;
          activeMarkers.push(new maplibregl.Marker({ element: label, anchor: "bottom", offset: labelMarkerOffset(stop, index, item, offset) }).setLngLat(stop.coord).addTo(map));
        }
      });
    }

    function markerOffset(stop, index, item) {
      if (stop.placeKey === "kunshan") return [-36, 0];
      if (stop.placeKey === "wuxi-airport") return [36, 0];
      const sameCoordStops = item.numberedStops.filter((entry) => sameCoord(entry.coord, stop.coord));
      if (sameCoordStops.length > 1) {
        const duplicateIndex = sameCoordStops.findIndex((entry) => entry.placeKey === stop.placeKey);
        const offsets = [[0, -18], [22, 0], [-22, 0], [0, 18], [26, 18], [-26, 18]];
        return offsets[duplicateIndex] || [0, 0];
      }
      return [0, 0];
    }

    function sameCoord(a, b) {
      return Math.abs(a[0] - b[0]) < 0.0001 && Math.abs(a[1] - b[1]) < 0.0001;
    }

    function offsetClass(stop) {
      if (stop.placeKey === "kunshan") return "offset-left";
      if (stop.placeKey === "wuxi-airport") return "offset-right";
      return "";
    }

    function stopClass(stop, index, item) {
      if (index === 0) return "start";
      if (index === item.numberedStops.length - 1) return "end";
      if (stop.role.includes("转场") || stop.role.includes("落脚") || stop.role.includes("晚餐")) return "transfer";
      return "scenic";
    }

    function labelMarkerOffset(stop, index, item, pinOffset) {
      if (stop.placeKey === "kunshan") return [-54, -28];
      if (stop.placeKey === "wuxi-airport") return [54, -28];
      const middleOffsets = [-62, 62, -42, 42, 0];
      const x = pinOffset[0] + (index === 0 || index === item.numberedStops.length - 1 ? 0 : middleOffsets[index % middleOffsets.length]);
      const y = pinOffset[1] - 28 - (index % 2) * 18;
      return [x, y];
    }

    function renderRail() {
      const rail = document.getElementById("dayRail");
      tripData.days.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = "day-button";
        button.type = "button";
        button.innerHTML = `<b>D${item.day}</b>`;
        button.addEventListener("click", () => selectDay(index));
        rail.appendChild(button);
        dayButtons.push(button);
      });
    }

    function shortTitle(item) {
      return item.focus.replace("，", "、").split("、")[0].slice(0, 5);
    }

    function routeText(item) {
      return item.numberedStops.map((stop) => stop.shortLabel || stop.name).join(" → ");
    }

    function updateText(item) {
      document.getElementById("dayChip").textContent = `第${item.day}天`;
      document.getElementById("modePill").textContent = item.transportMode;
      document.getElementById("dayTitle").textContent = item.focus;
      document.getElementById("routeLine").textContent = routeText(item);
      document.getElementById("stayLine").textContent = item.overnightLabel;
      document.getElementById("sheetTitle").textContent = `第${item.day}天 · ${item.focus}`;
      document.getElementById("detailRoute").textContent = item.routeSummary;
      document.getElementById("detailDesc").textContent = item.parentReminder;
      document.getElementById("nightLabel").textContent = item.day === 8 ? "返程" : "当天晚上";
      document.getElementById("nightPlace").textContent = item.eveningBase;
      document.getElementById("chips").innerHTML = [
        `早上：${item.morningStart}`,
        item.movementType,
        item.estimatedDriving,
        ...item.mainStops
      ].map((tag) => `<span class="chip">${tag}</span>`).join("");
    }

    function boundsForCoords(coords) {
      return coords.reduce((bounds, coord) => bounds.extend(coord), new maplibregl.LngLatBounds(coords[0], coords[0]));
    }

    function responsivePadding() {
      return window.innerWidth < 820
        ? { top: 168, right: 42, bottom: 112, left: 42 }
        : { top: 168, right: 90, bottom: 112, left: 430 };
    }

    function selectDay(index) {
      if (!mapReady) return;
      activeIndex = index;
      const item = tripData.days[index];
      const coords = coordinates(item);

      updateText(item);
      addMarkersForDay(item);
      dayButtons.forEach((button, i) => button.classList.toggle("active", i === index));
      dayButtons[index]?.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      setDetailOpen(false);

      if (animationFrame) cancelAnimationFrame(animationFrame);
      map.getSource("active-route").setData(collection());
      moveMapToDay(item, coords);
      animateRoute(item, coords);
    }

    function animateRoute(item, coords) {
      const duration = 1100;
      const start = performance.now();
      function tick(now) {
        const progress = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const count = Math.max(2, Math.ceil(coords.length * eased));
        map.getSource("active-route").setData(collection([routeFeature(item, coords.slice(0, count))]));
        if (progress < 1) animationFrame = requestAnimationFrame(tick);
      }
      animationFrame = requestAnimationFrame(tick);
    }

    function moveMapToDay(item, coords) {
      map.easeTo({
        center: centerOfCoords(coords),
        zoom: fixedZoom(modeKey(item) === "flight" || modeKey(item) === "return"),
        duration: 650,
        essential: true
      });
    }

    function centerOfCoords(coords) {
      return [
        coords.reduce((sum, coord) => sum + coord[0], 0) / coords.length,
        coords.reduce((sum, coord) => sum + coord[1], 0) / coords.length
      ];
    }

    function fixedZoom(flightDay) {
      if (flightDay) return window.innerWidth < 820 ? 3.05 : 3.65;
      return window.innerWidth < 820 ? 5.55 : 5.95;
    }

    async function init() {
      const response = await fetch("data/itinerary-structured.json");
      tripData = await response.json();
      addMapLayers();
      renderRail();
      mapReady = true;
      selectDay(0);
    }

    map.on("load", () => {
      init().catch((error) => {
        console.error(error);
        document.getElementById("dayTitle").textContent = "行程数据加载失败";
        document.getElementById("routeLine").textContent = "请检查 data/itinerary-structured.json";
      });
    });

    function setDetailOpen(open) {
      document.querySelector(".top-card").classList.toggle("expanded", open);
      document.getElementById("detailSheet").classList.toggle("open", open);
      document.getElementById("detailButton").textContent = open ? "关闭详情" : "查看详情";
    }

    document.getElementById("detailButton").addEventListener("click", () => {
      setDetailOpen(!document.getElementById("detailSheet").classList.contains("open"));
    });
    window.addEventListener("resize", () => { if (mapReady) map.resize(); });
  </script>
</body>
</html>
