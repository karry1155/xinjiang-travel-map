<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>新疆 8 日路线地图</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --ink: #17212b;
      --muted: #667483;
      --panel: rgba(255, 255, 255, 0.94);
      --line: rgba(27, 42, 55, 0.14);
      --teal: #0f766e;
      --road: #c05a22;
      --flight: #2563eb;
      --return: #6d35c6;
      --gold: #a45a13;
      --shadow: 0 18px 46px rgba(17, 30, 42, 0.18);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      background: #edf3f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button { font: inherit; }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #dce8ee;
    }

    .shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(237, 243, 246, 0.94),
        rgba(237, 243, 246, 0.18) 150px,
        rgba(237, 243, 246, 0) calc(100% - 170px),
        rgba(237, 243, 246, 0.95)
      );
    }

    .top-card {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      left: 12px;
      z-index: 5;
      padding: 14px;
      border: 1px solid rgba(27, 42, 55, 0.12);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .day-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .day-chip {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: #e7f6f3;
      color: var(--teal);
      font-size: 13px;
      font-weight: 820;
      white-space: nowrap;
    }

    .mode-pill {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }

    .top-card h1 {
      margin: 9px 0 6px;
      font-size: 22px;
      line-height: 1.18;
      font-weight: 840;
    }

    .route-line {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
      font-weight: 760;
    }

    .stay-line {
      margin: 8px 0 0;
      color: #95530f;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 780;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .control-button {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(27, 42, 55, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 780;
    }

    .control-button.primary {
      border-color: rgba(15, 118, 110, 0.5);
      background: var(--teal);
      color: #fff;
    }

    .control-button:hover,
    .control-button:focus-visible {
      border-color: var(--teal);
      outline: none;
    }

    .detail-sheet {
      position: absolute;
      right: 12px;
      bottom: calc(92px + env(safe-area-inset-bottom));
      left: 12px;
      z-index: 6;
      display: none;
      max-height: min(54vh, 430px);
      padding: 16px;
      border: 1px solid rgba(27, 42, 55, 0.14);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow-y: auto;
    }

    .detail-sheet.open { display: block; }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .sheet-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .close-button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .detail-route {
      margin: 0;
      font-size: 15px;
      line-height: 1.55;
      font-weight: 760;
    }

    .detail-desc {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .night-box {
      margin-top: 14px;
      padding: 12px 13px;
      border: 1px solid rgba(164, 90, 19, 0.22);
      border-radius: 8px;
      background: #fff8ed;
    }

    .night-box span {
      display: block;
      color: #934f0f;
      font-size: 12px;
      font-weight: 820;
    }

    .night-box b {
      display: block;
      margin-top: 4px;
      font-size: 16px;
      line-height: 1.35;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .chip {
      padding: 6px 9px;
      border-radius: 7px;
      background: #edf6f4;
      color: #155e57;
      font-size: 12px;
      font-weight: 740;
    }

    .day-rail {
      position: absolute;
      right: 0;
      bottom: env(safe-area-inset-bottom);
      left: 0;
      z-index: 5;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 74px;
      gap: 8px;
      padding: 10px 12px 12px;
      border-top: 1px solid rgba(27, 42, 55, 0.12);
      background: rgba(255, 255, 255, 0.93);
      box-shadow: 0 -12px 34px rgba(17, 30, 42, 0.12);
      backdrop-filter: blur(16px);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
    }

    .day-button {
      min-width: 74px;
      min-height: 54px;
      padding: 8px;
      border: 1px solid rgba(27, 42, 55, 0.1);
      border-radius: 8px;
      background: rgba(248, 251, 252, 0.78);
      color: inherit;
      text-align: center;
      cursor: pointer;
      scroll-snap-align: start;
    }

    .day-button.active {
      border-color: rgba(15, 118, 110, 0.42);
      background: #edf8f5;
      box-shadow: inset 0 -3px 0 var(--teal);
    }

    .day-button b {
      display: block;
      color: var(--teal);
      font-size: 12px;
      line-height: 1.2;
    }

    .day-button span {
      display: block;
      margin-top: 6px;
      overflow: hidden;
      color: var(--ink);
      font-size: 11px;
      font-weight: 740;
      line-height: 1.25;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right { z-index: 7; }

    .maplibregl-ctrl-bottom-right { margin-bottom: 88px; }

    .stop-marker {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--teal);
      color: #fff;
      box-shadow: 0 10px 20px rgba(17, 30, 42, 0.25);
      font-size: 13px;
      font-weight: 860;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.82);
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms ease;
    }

    .stop-marker.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .stop-marker.flight { background: var(--flight); }
    .stop-marker.start { background: #1d4ed8; }
    .stop-marker.end { background: var(--gold); }

    .stop-label {
      min-width: 92px;
      max-width: 150px;
      padding: 7px 9px;
      border: 1px solid rgba(27, 42, 55, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 22px rgba(17, 30, 42, 0.14);
      color: var(--ink);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 160ms ease, visibility 160ms ease;
    }

    .stop-label.visible {
      opacity: 1;
      visibility: visible;
    }

    .stop-label span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 780;
    }

    .stop-label b {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.25;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    @media (min-width: 820px) {
      .top-card {
        right: auto;
        width: 390px;
      }

      .detail-sheet {
        right: auto;
        bottom: 98px;
        width: 390px;
      }

      .day-rail {
        right: 18px;
        bottom: 18px;
        left: 18px;
        border: 1px solid rgba(27, 42, 55, 0.12);
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div id="map" aria-label="开源地图路线"></div>
    <div class="shade"></div>

    <section class="top-card" aria-live="polite">
      <div class="day-row">
        <span class="day-chip" id="dayChip">第1天</span>
        <span class="mode-pill" id="modePill">飞机</span>
      </div>
      <h1 id="dayTitle">抵达入住</h1>
      <p class="route-line" id="routeLine">无锡 → 石河子</p>
      <p class="stay-line" id="stayLine">夜宿：石河子</p>
      <div class="actions">
        <button class="control-button primary" id="playButton" type="button">播放</button>
        <button class="control-button" id="detailButton" type="button">详情</button>
      </div>
    </section>

    <aside class="detail-sheet" id="detailSheet" aria-label="当天详情">
      <div class="sheet-head">
        <h2 id="sheetTitle">第1天 · 抵达入住</h2>
        <button class="close-button" id="closeSheet" type="button" aria-label="关闭详情">×</button>
      </div>
      <p class="detail-route" id="detailRoute"></p>
      <p class="detail-desc" id="detailDesc"></p>
      <div class="night-box">
        <span id="nightLabel">当天晚上</span>
        <b id="nightPlace">石河子</b>
      </div>
      <div class="chips" id="chips"></div>
    </aside>

    <nav class="day-rail" id="dayRail" aria-label="选择行程天数"></nav>
  </main>

  <script>
    const places = {
      wuxi: { name: "无锡", note: "航班端点", coord: [120.312, 31.491], kind: "flight" },
      shihezi: { name: "石河子", note: "进出疆机场", coord: [86.0806, 44.3061], kind: "flight" },
      sailimu: { name: "赛里木湖", note: "湖景", coord: [81.1743, 44.6139] },
      guozigou: { name: "果子沟大桥", note: "桥景", coord: [80.9622, 44.4556] },
      yining: { name: "伊宁", note: "夜宿方向", coord: [81.28, 43.94] },
      nalati: { name: "那拉提", note: "草原", coord: [84.2704, 43.2625] },
      xinyuan: { name: "新源/巩留", note: "夜宿方向", coord: [83.2629, 43.4304] },
      flower: { name: "天山花海", note: "拍照", coord: [81.1808, 43.9631] },
      kazanqi: { name: "喀赞其", note: "民俗街区", coord: [81.3267, 43.9089] },
      kuitun: { name: "奎屯", note: "夜宿方向", coord: [84.9023, 44.4269] },
      dushanzi: { name: "独山子峡谷", note: "峡谷地貌", coord: [84.8062, 44.0923] },
      urumqi: { name: "乌鲁木齐", note: "夜宿方向", coord: [87.6168, 43.8256] },
      tianchi: { name: "天山天池", note: "景区", coord: [88.1201, 43.8943] },
      nanshan: { name: "南山牧场", note: "牧场", coord: [87.1798, 43.4509] }
    };

    const itinerary = [
      { day: 1, theme: "抵达入住", route: "无锡 → 石河子", desc: "08:00 从无锡起飞，13:20 抵达石河子。当天只处理抵达和入住。", stay: "石河子", tags: ["航班", "抵达", "入住"], mode: "flight", path: ["wuxi", "shihezi"] },
      { day: 2, theme: "湖景与公路桥", route: "石河子 → 赛里木湖 → 果子沟 → 伊宁", desc: "这天核心是湖景和果子沟大桥，晚上停到伊犁方向。", stay: "伊宁/可克达拉方向", tags: ["赛里木湖", "果子沟", "伊犁"], mode: "car", path: ["shihezi", "sailimu", "guozigou", "yining"] },
      { day: 3, theme: "草原风景", route: "伊宁 → 那拉提 → 新源/巩留", desc: "重点看那拉提大草原和空中草原，晚上落在新源/巩留方向。", stay: "新源/巩留方向", tags: ["那拉提", "空中草原", "草原"], mode: "car", path: ["yining", "nalati", "xinyuan"] },
      { day: 4, theme: "花海与民俗", route: "新源/巩留 → 天山花海 → 喀赞其 → 奎屯", desc: "花海拍照后去喀赞其民俗村，再往奎屯/双河/博乐方向移动。", stay: "奎屯/双河/博乐方向", tags: ["天山花海", "喀赞其", "转场"], mode: "car", path: ["xinyuan", "flower", "kazanqi", "kuitun"] },
      { day: 5, theme: "峡谷地貌", route: "奎屯 → 独山子大峡谷 → 乌鲁木齐", desc: "看独山子大峡谷，然后进入乌鲁木齐/昌吉方向。", stay: "乌鲁木齐/昌吉方向", tags: ["独山子", "峡谷", "乌鲁木齐"], mode: "car", path: ["kuitun", "dushanzi", "urumqi"] },
      { day: 6, theme: "展馆与天池", route: "乌鲁木齐 → 天山天池 → 乌鲁木齐", desc: "有展馆/购物属性安排，也有天山天池景区和红酒晚宴。", stay: "乌鲁木齐/昌吉方向", tags: ["和田玉", "天山天池", "晚宴"], mode: "car", path: ["urumqi", "tianchi", "urumqi"] },
      { day: 7, theme: "体验与牧场", route: "乌鲁木齐 → 南山牧场 → 乌鲁木齐", desc: "展馆/体验类安排后去南山牧场，看牧场风景。", stay: "乌鲁木齐/昌吉方向", tags: ["宝藏馆", "边疆之花", "南山牧场"], mode: "car", path: ["urumqi", "nanshan", "urumqi"] },
      { day: 8, theme: "返程", route: "乌鲁木齐 → 石河子 → 无锡", desc: "回到石河子机场，14:05 起飞，18:40 抵达无锡。", stay: "回家", tags: ["石河子", "返程", "无锡"], mode: "return", path: ["urumqi", "shihezi", "wuxi"] }
    ];

    const colors = { flight: "#2563eb", car: "#c05a22", return: "#6d35c6" };
    const dayButtons = [];
    const stopMarkers = new Map();
    const labelMarkers = new Map();
    let activeIndex = 0;
    let playTimer = null;
    let mapReady = false;
    let animationFrame = null;

    const openStreetMapStyle = {
      version: 8,
      sources: {
        osm: {
          type: "raster",
          tiles: [
            "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
            "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png",
            "https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"
          ],
          tileSize: 256,
          attribution: "© OpenStreetMap contributors"
        }
      },
      layers: [{
        id: "osm-raster",
        type: "raster",
        source: "osm",
        paint: { "raster-opacity": 0.9, "raster-saturation": -0.14, "raster-contrast": -0.04 }
      }]
    };

    const map = new maplibregl.Map({
      container: "map",
      style: openStreetMapStyle,
      center: [86.8, 43.7],
      zoom: 5.2,
      pitch: 0,
      attributionControl: true
    });
    window.tripMap = map;
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");

    function coordinates(keys, mode) {
      const raw = keys.map((key) => places[key].coord);
      if (mode === "flight") return curvedLine(raw[0], raw[1], 84);
      if (mode === "return") return [...straightLine(raw[0], raw[1], 24), ...curvedLine(raw[1], raw[2], 84).slice(1)];
      return raw.flatMap((point, index) => index === 0 ? [point] : straightLine(raw[index - 1], point, 24).slice(1));
    }

    function straightLine(a, b, steps) {
      return Array.from({ length: steps + 1 }, (_, i) => {
        const t = i / steps;
        return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      });
    }

    function curvedLine(a, b, steps) {
      const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + Math.abs(a[0] - b[0]) * 0.12];
      return Array.from({ length: steps + 1 }, (_, i) => {
        const t = i / steps;
        const x = (1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * mid[0] + t * t * b[0];
        const y = (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * mid[1] + t * t * b[1];
        return [x, y];
      });
    }

    function routeFeature(item, visibleCoords = null) {
      return {
        type: "Feature",
        properties: { day: item.day, mode: item.mode, color: colors[item.mode] },
        geometry: { type: "LineString", coordinates: visibleCoords || coordinates(item.path, item.mode) }
      };
    }

    function collection(features = []) {
      return { type: "FeatureCollection", features };
    }

    function addMapLayers() {
      map.addSource("all-routes", { type: "geojson", data: collection(itinerary.map((item) => routeFeature(item))) });
      map.addSource("active-route", { type: "geojson", data: collection() });

      map.addLayer({
        id: "all-routes-line",
        type: "line",
        source: "all-routes",
        paint: { "line-color": ["get", "color"], "line-width": 2, "line-opacity": 0.14 }
      });

      map.addLayer({
        id: "active-route-glow",
        type: "line",
        source: "active-route",
        paint: { "line-color": ["get", "color"], "line-width": 12, "line-opacity": 0.16, "line-blur": 3 }
      });

      map.addLayer({
        id: "active-route-line",
        type: "line",
        source: "active-route",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": ["get", "color"], "line-width": 6, "line-opacity": 0.96 }
      });
    }

    function addMarkers() {
      Object.entries(places).forEach(([key, place]) => {
        const pin = document.createElement("div");
        pin.className = `stop-marker ${place.kind === "flight" ? "flight" : ""}`;
        pin.textContent = "·";
        pin.title = place.name;
        new maplibregl.Marker({ element: pin, anchor: "center" }).setLngLat(place.coord).addTo(map);
        stopMarkers.set(key, pin);

        const label = document.createElement("div");
        label.className = "stop-label";
        label.innerHTML = `<span>${place.note}</span><b>${place.name}</b>`;
        new maplibregl.Marker({ element: label, anchor: "bottom", offset: [0, -22] }).setLngLat(place.coord).addTo(map);
        labelMarkers.set(key, label);
      });
    }

    function renderRail() {
      const rail = document.getElementById("dayRail");
      itinerary.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = "day-button";
        button.type = "button";
        button.innerHTML = `<b>D${item.day}</b><span>${item.theme}</span>`;
        button.addEventListener("click", () => selectDay(index));
        rail.appendChild(button);
        dayButtons.push(button);
      });
    }

    function updateText(item) {
      document.getElementById("dayChip").textContent = `第${item.day}天`;
      document.getElementById("modePill").textContent = item.mode === "flight" ? "飞机" : item.mode === "return" ? "返程" : "汽车";
      document.getElementById("dayTitle").textContent = item.theme;
      document.getElementById("routeLine").textContent = item.route;
      document.getElementById("stayLine").textContent = item.day === 8 ? "返程：回家" : `夜宿：${item.stay}`;
      document.getElementById("sheetTitle").textContent = `第${item.day}天 · ${item.theme}`;
      document.getElementById("detailRoute").textContent = item.route;
      document.getElementById("detailDesc").textContent = item.desc;
      document.getElementById("nightLabel").textContent = item.day === 8 ? "返程" : "当天晚上";
      document.getElementById("nightPlace").textContent = item.stay;
      document.getElementById("chips").innerHTML = item.tags.map((tag) => `<span class="chip">${tag}</span>`).join("");
    }

    function uniqueKeys(keys) {
      return [...new Set(keys)];
    }

    function updateMarkers(item) {
      const visible = uniqueKeys(item.path);
      stopMarkers.forEach((el, key) => {
        const index = visible.indexOf(key);
        el.classList.toggle("visible", index >= 0);
        el.classList.toggle("start", index === 0);
        el.classList.toggle("end", index === visible.length - 1);
        el.textContent = index >= 0 ? String(index + 1) : "·";
      });

      labelMarkers.forEach((el, key) => {
        const index = visible.indexOf(key);
        const shouldLabel = index === 0 || index === visible.length - 1 || visible.length <= 2;
        el.classList.toggle("visible", shouldLabel);
      });
    }

    function boundsForCoords(coords) {
      return coords.reduce((bounds, coord) => bounds.extend(coord), new maplibregl.LngLatBounds(coords[0], coords[0]));
    }

    function responsivePadding() {
      return window.innerWidth < 820
        ? { top: 168, right: 42, bottom: 112, left: 42 }
        : { top: 168, right: 90, bottom: 112, left: 430 };
    }

    function selectDay(index) {
      if (!mapReady) return;
      activeIndex = index;
      const item = itinerary[index];
      const coords = coordinates(item.path, item.mode);

      updateText(item);
      updateMarkers(item);
      dayButtons.forEach((button, i) => button.classList.toggle("active", i === index));
      dayButtons[index]?.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      document.getElementById("detailSheet").classList.remove("open");

      if (animationFrame) cancelAnimationFrame(animationFrame);
      map.getSource("active-route").setData(collection());
      map.fitBounds(boundsForCoords(coords), {
        padding: responsivePadding(),
        maxZoom: item.mode === "flight" || item.mode === "return" ? 5.4 : 8.8,
        duration: 650
      });
      animateRoute(item, coords);
    }

    function animateRoute(item, coords) {
      const duration = 1100;
      const start = performance.now();
      function tick(now) {
        const progress = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const count = Math.max(2, Math.ceil(coords.length * eased));
        map.getSource("active-route").setData(collection([routeFeature(item, coords.slice(0, count))]));
        if (progress < 1) animationFrame = requestAnimationFrame(tick);
      }
      animationFrame = requestAnimationFrame(tick);
    }

    function stopPlayback() {
      if (playTimer) clearInterval(playTimer);
      playTimer = null;
      document.getElementById("playButton").textContent = "播放";
    }

    function playRoute() {
      if (playTimer) {
        stopPlayback();
        return;
      }
      document.getElementById("playButton").textContent = "暂停";
      selectDay(0);
      playTimer = setInterval(() => {
        if (activeIndex >= itinerary.length - 1) {
          stopPlayback();
          return;
        }
        selectDay(activeIndex + 1);
      }, 2300);
    }

    map.on("load", () => {
      addMapLayers();
      addMarkers();
      renderRail();
      mapReady = true;
      selectDay(0);
    });

    document.getElementById("playButton").addEventListener("click", playRoute);
    document.getElementById("detailButton").addEventListener("click", () => {
      document.getElementById("detailSheet").classList.toggle("open");
    });
    document.getElementById("closeSheet").addEventListener("click", () => {
      document.getElementById("detailSheet").classList.remove("open");
    });
    window.addEventListener("resize", () => { if (mapReady) map.resize(); });
  </script>
</body>
</html>
